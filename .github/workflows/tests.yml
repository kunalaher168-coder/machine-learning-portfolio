name: Reporting tests
on:
  push:
    branches: [geospatial-reporting]
  pull_request:
    branches: [geospatial-reporting]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
